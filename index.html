<!DOCTYPE html>
<html>
	<head>
		<meta charset="UTF-8">
		<title>Nejma Luciana</title>
		<style>
			body {
			margin: 0;
			padding: 0;
			}

			h2, p {
			margin: 10px;
			}

			ul {
			list-style-type: none;
			margin: 0;
			padding: 0;
			background-color: #000000;
			display: flex;
			justify-content: center;
			}

			ul li a {
			display: block;
			color: white;
			padding: 14px 16px;
			text-decoration: none;
			}

			ul li a:hover {
			background-color: #111111;
			}

			.main-header {
				display: flex;
				justify-content: space-between; /* Pushes logo to left, links to right */
				align-items: center; /* Vertically centers items */
				padding: 10px 20px; /* Add some padding */
				background-color: #000000; /* Example background */
				}

			.logo-img {
				height: 50px;
				width: auto;
				}

			.main-nav ul {
				list-style: none;
				margin: 0;
				padding: 0;
				display: flex;
				}

			.main-nav ul li {
				margin-left: 20px;
				}

			.main-nav ul li a {
				text-decoration: none;
				color: #333;
				}

	</style>
	</head>
	<body style="background-color: #000000;">
		<header class="main-header">
  			<a href="/" class="logo-link">
    		<img src="images/nejmalogo.png" alt="Company Logo" class="logo-img">
  			</a>

			<nav class="main-nav">
				<ul>
					<li><a href="index.html"><h3 style="color:#94801d">HOME</h3></a></li>
					<li><a href="about.html"><h3 style="color: #94801d">ABOUT</h3></a></li>
				</ul>
			</nav>
		</header>
	</body>
</html>
